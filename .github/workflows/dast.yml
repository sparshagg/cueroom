name: DAST

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build CueRoom
        env:
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:4000
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start CueRoom web and API
        env:
          AUTH_REQUIRED: "false"
          HOST: 127.0.0.1
          LIVEKIT_API_KEY: devkey
          LIVEKIT_API_SECRET: secret
          LIVEKIT_URL: ws://127.0.0.1:7880
          LOG_LEVEL: warn
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:4000
          PORT: 4000
          WEB_ORIGIN: http://127.0.0.1:3000
        run: |
          pnpm --filter @cueroom/api start > /tmp/cueroom-api.log 2>&1 &
          pnpm --filter @cueroom/web exec next start --port 3000 --hostname 127.0.0.1 > /tmp/cueroom-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4000/health >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/cueroom-api.log
          cat /tmp/cueroom-web.log
          exit 1
      - name: Start ZAP daemon for authenticated flow capture
        run: |
          docker run --rm --detach --name cueroom-zap --network host ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon -host 127.0.0.1 -port 8090 \
            -config api.disablekey=true \
            -config api.addrs.addr.name=127.0.0.1 \
            -config api.addrs.addr.regex=false
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8090/JSON/core/view/version/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs cueroom-zap
          exit 1
      - name: Authenticated create/join/report flow through ZAP
        env:
          DAST_API_ORIGIN: http://127.0.0.1:4000
          DAST_OUTPUT_DIR: artifacts/dast
          DAST_PROXY: http://127.0.0.1:8090
          DAST_WEB_ORIGIN: http://127.0.0.1:3000
        run: pnpm dast:authenticated-flows
      - name: Export authenticated ZAP evidence
        if: always()
        env:
          DAST_API_ORIGIN: http://127.0.0.1:4000
          DAST_OUTPUT_DIR: artifacts/dast
          DAST_REQUIRE_AUTHENTICATED_ZAP: "true"
          DAST_WEB_ORIGIN: http://127.0.0.1:3000
          DAST_ZAP_ORIGIN: http://127.0.0.1:8090
        run: pnpm dast:export-zap-evidence
      - name: Stop authenticated ZAP daemon
        if: always()
        run: docker rm -f cueroom-zap || true
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          allow_issue_writing: false
          cmd_options: "-m 1"
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          fail_action: false
          target: http://127.0.0.1:3000
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload authenticated DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cueroom-dast-authenticated-flow
          path: artifacts/dast
          if-no-files-found: warn
      - name: Upload DAST server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cueroom-dast-server-logs
          path: |
            /tmp/cueroom-api.log
            /tmp/cueroom-web.log
          if-no-files-found: warn
      - name: Ensure authenticated ZAP daemon is stopped
        if: always()
        run: |
          docker rm -f cueroom-zap || true
