name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cueroom
          POSTGRES_PASSWORD: cueroom
          POSTGRES_DB: cueroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cueroom -d cueroom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgres://cueroom:cueroom@localhost:5432/cueroom
      REDIS_TEST_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build Chrome Web Store review evidence
        run: |
          pnpm --filter @cueroom/shared build
          pnpm --filter @cueroom/security build
          pnpm --filter @cueroom/extension build
          mkdir -p artifacts/chrome-web-store
          (cd apps/extension/dist && zip -qr ../../../artifacts/chrome-web-store/cueroom-extension.zip .)
          cp apps/extension/dist/manifest.json artifacts/chrome-web-store/manifest.json
          cp docs/security/chrome-web-store-review.md artifacts/chrome-web-store/chrome-web-store-review.md
          pnpm security:extension > artifacts/chrome-web-store/manifest-audit.txt
      - name: Upload Chrome Web Store review evidence
        uses: actions/upload-artifact@v4
        with:
          name: cueroom-chrome-web-store-review
          path: artifacts/chrome-web-store

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f apps/api/Dockerfile .
      - run: docker build -f apps/web/Dockerfile .
