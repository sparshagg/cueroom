name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  schedule:
    - cron: "19 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:supply-chain
