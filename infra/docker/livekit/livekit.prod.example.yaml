port: 7880
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: redis:6379
  # username: default
  password: replace-with-redis-password
keys:
  cueroom-prod: replace-with-livekit-api-secret

# Public beta operators must choose a TURN strategy before inviting users behind
# restrictive networks. If enabling embedded TURN/TLS, provision a dedicated
# TURN domain and trusted certificate files, then expose the chosen TCP/UDP
# ports in compose and the host firewall.
